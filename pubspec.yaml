name: skin_analyzer
description: "Skin Observed System - Analizzatore cutaneo professionale"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  win32: ^5.5.1
  ffi: ^2.1.3
  provider: ^6.1.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  camera: ^0.11.0
  camera_windows: ^0.2.1+8
  image: ^4.2.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
